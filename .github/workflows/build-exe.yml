name: Build FishWatch.exe
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "pyinstaller==6.11.1"
      - run: python -X utf8 run.py --mock
      - run: python -m PyInstaller --noconfirm --clean fishwatch.spec
      - run: dist\FishWatch.exe --run-once --mock
      - uses: actions/upload-artifact@v4
        with:
          name: FishWatch-exe
          path: dist/FishWatch.exe
      - if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FishWatch.exe

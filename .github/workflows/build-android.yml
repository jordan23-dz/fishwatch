# GitHub에서 FishWatch 안드로이드 앱을 자동으로 만든다.
# - 저장소에 android 폴더(안드로이드 프로젝트)를 올려 두면 동작한다.
# - Actions 탭 → "Build Android" → Run workflow : 시험 빌드 (결과물은 Artifacts)
# - Releases에서 릴리스를 Publish 하면 FishWatch-android.apk 가 배포판에 자동으로 붙는다.
#
# 결과물
#   FishWatch-android.apk : 휴대폰에 바로 설치해 보는 시험용 (구글 플레이 업로드용 아님)
#   app-release.aab        : 구글 플레이 업로드용. 아래 4개 비밀값을 등록했을 때만 만든다.
#     저장소 Settings > Secrets and variables > Actions > New repository secret
#       KEYSTORE_BASE64   업로드 키 파일(.jks)을 base64로 인코딩한 값
#       KEYSTORE_PASSWORD 키 저장소 비밀번호
#       KEY_ALIAS         키 별칭
#       KEY_PASSWORD      키 비밀번호
name: Build Android
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Find android project
        id: dir
        shell: bash
        run: |
          for d in android fishwatch-android FishWatch-android .; do
            if [ -f "$d/settings.gradle" ] && [ -f "$d/app/build.gradle" ]; then echo "path=$d" >> "$GITHUB_OUTPUT"; echo "android project: $d"; exit 0; fi
          done
          echo "::error::안드로이드 프로젝트 폴더(android)를 저장소에서 찾지 못했습니다. fishwatch-android 압축을 풀어 android 폴더로 올려 주세요."
          exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # 빌드 컴퓨터(ubuntu)에 이미 깔린 Android SDK를 쓴다. 라이선스 동의 + 필요한 플랫폼만 설치
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "platform-tools" > /dev/null || echo "플랫폼은 빌드 중에 자동으로 받습니다"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > "${{ steps.dir.outputs.path }}/local.properties"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build test APK
        working-directory: ${{ steps.dir.outputs.path }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/FishWatch-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FishWatch-android-apk
          path: FishWatch-android.apk

      - name: Build Play bundle (AAB)
        id: aab
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          FW_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FW_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: ${{ steps.dir.outputs.path }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export FW_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew --no-daemon bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/app-release.aab"
      - if: steps.aab.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FishWatch-android-aab
          path: app-release.aab

      - if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: FishWatch-android.apk

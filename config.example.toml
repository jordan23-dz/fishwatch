# 이 파일을 config.toml 로 복사한 뒤 값을 채우세요.

[naver]
# hub    : NAVER API HUB(네이버 클라우드 플랫폼)에서 발급한 키. 신규 발급은 이 방식만 가능
# legacy : 2026-07-30까지 네이버 개발자센터에서 발급받은 기존 키 (2027-06-30까지 사용 가능)
provider = "hub"
client_id = ""        # 비워 두면 환경변수 NAVER_CLIENT_ID 사용
client_secret = ""    # 비워 두면 환경변수 NAVER_CLIENT_SECRET 사용

[collect]
# cafearticle = 네이버 카페, blog = 네이버 블로그,
# webkr = 웹문서 검색(아래 판매 사이트 글을 걸러냄)
sources = ["cafearticle", "blog", "webkr"]
# 1회 실행당 API 호출 상한. 검색 API 한도는 하루 25,000회
max_calls = 800
# 어획 지역을 고정하려면 지정 (예: "제주"). 비워 두면 글 본문의 지명으로 자동 판단
region = ""
# 상시 감시어·금어기 어종 외에 추가로 돌릴 검색어
extra_queries = ["자연산 광어 판매", "자연산 우럭 판매", "자연산 전복 판매", "대문어 판매"]

[report]
# 보고서에 올릴 최소 등급: danger(위반 의심) / warn(확인 필요) / info
min_severity = "warn"
out_dir = "reports"
database = "fishwatch.db"

# 판매 사이트를 바꾸려면 아래 주석을 풀고 고치세요. 적어 두면 기본 목록(14곳) 대신 이 목록만 씁니다.
